<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Editor</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            background-color: #f9fafb;
            transition: all 0.2s;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-area:hover {
            border-color: #9ca3af;
        }
        .upload-area.drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LoginScreen = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                // Simple password check - change this to whatever you want
                if (password === 'dcs2025secure') {
                    onLogin();
                } else {
                    setError('Incorrect password');
                    setPassword('');
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div className="bg-white p-8 rounded-lg shadow-md max-w-md w-full">
                        <h2 className="text-2xl font-bold text-gray-900 mb-6 text-center">Article Editor Login</h2>
                        <form onSubmit={handleSubmit}>
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Enter password..."
                                    autoFocus
                                />
                            </div>
                            {error && (
                                <div className="mb-4 text-red-600 text-sm">{error}</div>
                            )}
                            <button 
                                type="submit"
                                className="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
                            >
                                Login
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const ArticleEditor = () => {
            const [articles, setArticles] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [currentArticle, setCurrentArticle] = useState(null);
            const [isModified, setIsModified] = useState(false);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [publishing, setPublishing] = useState(false);
            const [error, setError] = useState(null);
            const [saveSuccess, setSaveSuccess] = useState(false);
            const [publishSuccess, setPublishSuccess] = useState(false);
            const [uploadingImage, setUploadingImage] = useState(false);
            const [dragOver, setDragOver] = useState(false);
            const [deleting, setDeleting] = useState(false);
            const [rejecting, setRejecting] = useState(false);
            const [jumpToNumber, setJumpToNumber] = useState('');
const [filters, setFilters] = useState({
    status: 'All',
    client: 'All', 
    sourceTitle: 'All'
});

            const [initialLoad, setInitialLoad] = useState(true);

            const AIRTABLE_TOKEN = 'pataRcas3it7P6ORU.6110388beefd455491288001eda445104bcadc214092f01ab27254a1a378d1f7';
            const BASE_ID = 'appE5EmeKwxQh72OQ';
            const TABLE_ID = 'tbl7oJGWlzTE9iQqz';

            // Fetch articles from Airtable with filters
            const fetchArticles = async () => {
                try {
                    setLoading(true);
                    setError(null);
                    
                    // Build filter formula
                    const filterConditions = [];
                    if (filters.status !== 'All') {
                        filterConditions.push(`{Status}='${filters.status}'`);
                    }
                    if (filters.client !== 'All') {
                        filterConditions.push(`{Client}='${filters.client}'`);
                    }
           if (filters.sourceTitle !== 'All') {
    filterConditions.push(`{Source Title}='${filters.sourceTitle}'`);
}
                    
                    let url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`;
const urlParams = new URLSearchParams();

// Add sorting by most recent first
urlParams.append('sort[0][field]', 'Generated Date');
urlParams.append('sort[0][direction]', 'desc');

if (filterConditions.length > 0) {
    const filterFormula = filterConditions.length === 1 
        ? filterConditions[0]
        : `AND(${filterConditions.join(',')})`;
    urlParams.append('filterByFormula', filterFormula);
}

url += `?${urlParams.toString()}`;


                    
                    const response = await fetch(url, {
                        headers: {
                            'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`Failed to fetch articles: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    const formattedArticles = data.records.map(record => ({
                        id: record.id,
                        ...record.fields
                    }));

                    if (formattedArticles.length === 0) {
                        // No results found with current filters
                        if (initialLoad) {
                            // On initial load, if no results, show all articles
                            setError('No articles found with default filters. Showing all articles.');
                setFilters({ status: 'All', client: 'All', sourceTitle: 'All' });            
                            setInitialLoad(false);
                            return; // This will trigger useEffect again with 'All' filters
                        } else {
                            setError('No articles found matching current filters. Try adjusting your filter settings.');
                            // Keep existing articles and current article if we have them
                            if (articles.length === 0) {
                                setArticles([]);
                                setCurrentArticle(null);
                                setCurrentIndex(0);
                            }
                        }
                    } else {
                        setArticles(formattedArticles);
                        setCurrentArticle({...formattedArticles[0]});
                        setCurrentIndex(0);
                        setInitialLoad(false);
                        
                        // If this was successful and it's not initial load, try to set preferred defaults
          if (!initialLoad && filters.status === 'All' && filters.client === 'All' && filters.sourceTitle === 'All') {
                            // We have articles, let's see if we can set better defaults
                            setTimeout(() => {
                                setFilters({ 
                                    status: 'Edited', 
                                    client: 'dcsafrica', 
    sourceTitle: 'All' 
                                });
                            }, 100);
                        }
                    }
                } catch (err) {
                    setError(`Failed to load articles: ${err.message}`);
                    console.error('Error fetching articles:', err);
                } finally {
                    setLoading(false);
                }
            };

            // Jump to specific article number
            const handleJumpToArticle = () => {
                const articleNumber = parseInt(jumpToNumber);
                if (!articleNumber || articleNumber < 1) {
                    setError('Please enter a valid article number');
                    return;
                }

                const targetArticle = articles.find(article => article['Article Number'] === articleNumber);
                if (!targetArticle) {
                    setError(`Article ${articleNumber} not found`);
                    return;
                }

                const targetIndex = articles.findIndex(article => article['Article Number'] === articleNumber);
                goToArticle(targetIndex);
                setJumpToNumber('');
                setError(null);
            };

            // Delete article from Airtable
            const deleteArticle = async () => {
                if (!currentArticle?.id) return;
                
                // Confirm deletion
                if (!confirm(`Are you sure you want to DELETE this article permanently?\n\n"${currentArticle.Headline || 'Untitled'}"\n\nThis cannot be undone!`)) {
                    return;
                }

                try {
                    setDeleting(true);
                    setError(null);
                    
                    const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${currentArticle.id}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        const errorData = await response.text();
                        throw new Error(`Failed to delete article: ${response.status} ${response.statusText} - ${errorData}`);
                    }

                    console.log('Article deleted successfully');
                    
                    // Remove from local state
                    const updatedArticles = articles.filter(article => article.id !== currentArticle.id);
                    setArticles(updatedArticles);
                    
                    // Navigate to appropriate article
                    if (updatedArticles.length === 0) {
                        setCurrentArticle(null);
                        setCurrentIndex(0);
                    } else {
                        // If we deleted the last article, go to the previous one
                        const newIndex = currentIndex >= updatedArticles.length ? updatedArticles.length - 1 : currentIndex;
                        setCurrentIndex(newIndex);
                        setCurrentArticle({...updatedArticles[newIndex]});
                    }
                    
                    setIsModified(false);

                } catch (err) {
                    console.error('Delete failed:', err);
                    setError(`Failed to delete article: ${err.message}`);
                } finally {
                    setDeleting(false);
                }
            };

            // Reject article (set status to 'rejected')
            const rejectArticle = async () => {
                if (!currentArticle?.id) return;

                try {
                    setRejecting(true);
                    setError(null);

                    const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${currentArticle.id}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            fields: {
                                'Status': 'Rejected'
                            }
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.text();
                        throw new Error(`Failed to reject article: ${response.status} ${response.statusText} - ${errorData}`);
                    }

                    const updatedRecord = await response.json();
                    console.log('Article rejected successfully');
                    
                    // Update local state
                    const updatedArticles = articles.map(article => 
                        article.id === currentArticle.id ? { id: updatedRecord.id, ...updatedRecord.fields } : article
                    );
                    setArticles(updatedArticles);
                    setCurrentArticle({ id: updatedRecord.id, ...updatedRecord.fields });
                    setIsModified(false);

                    // Move to next article after rejecting
                    setTimeout(() => {
                        if (currentIndex < articles.length - 1) {
                            handleNext();
                        }
                    }, 500);

                } catch (err) {
                    console.error('Reject failed:', err);
                    setError(`Failed to reject article: ${err.message}`);
                } finally {
                    setRejecting(false);
                }
            };

            // Save article to Airtable with status update
            const saveArticle = async (status = 'Edited') => {
                if (!currentArticle?.id) return;

                try {
                    const isPublishing = status === 'Published';
                    if (isPublishing) {
                        setPublishing(true);
                    } else {
                        setSaving(true);
                    }
                    setError(null);

                    const { id, ...fields } = currentArticle;
                    
                    // Clean up fields - remove computed/read-only fields and undefined values
                    const cleanFields = {};
                    const readOnlyFields = ['Article Number', 'Generated Date'];
                    
                    Object.keys(fields).forEach(key => {
                        if (fields[key] !== undefined && 
                            fields[key] !== null && 
                            !readOnlyFields.includes(key)) {
                            cleanFields[key] = fields[key];
                        }
                    });

                    // Add status update
                    cleanFields['Status'] = status;
                    
                    console.log('Starting save process...');
                    console.log('Saving fields:', cleanFields);
                    
                    const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${id}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            fields: cleanFields
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.text();
                        console.error('Save error response:', errorData);
                        throw new Error(`Failed to save article: ${response.status} ${response.statusText} - ${errorData}`);
                    }

                    const updatedRecord = await response.json();
                    console.log('Save successful!');
                    
                    // Update local state
                    const updatedArticles = articles.map(article => 
                        article.id === id ? { id: updatedRecord.id, ...updatedRecord.fields } : article
                    );
                    setArticles(updatedArticles);
                    setCurrentArticle({ id: updatedRecord.id, ...updatedRecord.fields });
                    setIsModified(false);

                    // Show success feedback
                    if (isPublishing) {
                        setPublishSuccess(true);
                        setTimeout(() => {
                            setPublishSuccess(false);
                        }, 2000);
                    } else {
                        setSaveSuccess(true);
                        setTimeout(() => {
                            setSaveSuccess(false);
                        }, 2000);
                    }

                } catch (err) {
                    console.error('Save failed with error:', err);
                    setError(`Failed to ${status === 'Published' ? 'publish' : 'save'} article: ${err.message}`);
                } finally {
                    setSaving(false);
                    setPublishing(false);
                }
            };

            // Image upload functionality
            const uploadImageToImgBB = async (file) => {
                const formData = new FormData();
                formData.append('image', file);
                
                // Using your ImgBB API key
                const response = await fetch('https://api.imgbb.com/1/upload?key=bc8a6613dcf8f865f1ca0281d7daa739', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Failed to upload image to ImgBB');
                }
                
                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error?.message || 'Upload failed');
                }
                
                return data.data.url;
            };

            const handleImageUpload = async (file) => {
                if (!file || !file.type.startsWith('image/')) {
                    setError('Please select a valid image file');
                    return;
                }

                if (file.size > 32 * 1024 * 1024) { // 32MB limit for ImgBB
                    setError('Image file too large. Maximum size is 32MB');
                    return;
                }

                try {
                    setUploadingImage(true);
                    setError(null);
                    
                    // Upload to ImgBB and get permanent URL
                    const imageUrl = await uploadImageToImgBB(file);
                    handleFieldChange('Image URL', imageUrl);
                    
                    console.log('Image uploaded successfully:', imageUrl);
                    setUploadingImage(false);
                    
                } catch (err) {
                    console.error('Upload error:', err);
                    setError(`Failed to upload image: ${err.message}`);
                    setUploadingImage(false);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDragOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                
                const files = Array.from(e.dataTransfer.files);
                if (files.length > 0) {
                    handleImageUpload(files[0]);
                }
            };

            const handleFileInput = (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    handleImageUpload(files[0]);
                }
            };

            const handlePrevImage = () => {
                if (articles.length > 0) {
                    // Get all unique, valid image URLs (remove duplicates)
                    const allImageUrls = articles
                        .map(article => article['Image URL'])
                        .filter(url => url && url.trim() !== '');
                    
                    // Create array of unique URLs only
                    const uniqueImageUrls = [...new Set(allImageUrls)];
                    
                    if (uniqueImageUrls.length === 0) return;
                    
                    const currentImageUrl = currentArticle['Image URL'];
                    let currentImageIndex = uniqueImageUrls.findIndex(url => url === currentImageUrl);
                    
                    // If current image not found, start from the end
                    if (currentImageIndex === -1) {
                        currentImageIndex = uniqueImageUrls.length - 1;
                    } else {
                        // Move to previous image
                        currentImageIndex = currentImageIndex > 0 ? currentImageIndex - 1 : uniqueImageUrls.length - 1;
                    }
                    
                    const newImageUrl = uniqueImageUrls[currentImageIndex];
                    console.log('Prev image:', currentImageIndex + 1, '/', uniqueImageUrls.length, newImageUrl);
                    
                    if (newImageUrl) {
                        handleFieldChange('Image URL', newImageUrl);
                    }
                }
            };

            const handleNextImage = () => {
                if (articles.length > 0) {
                    // Get all unique, valid image URLs (remove duplicates)
                    const allImageUrls = articles
                        .map(article => article['Image URL'])
                        .filter(url => url && url.trim() !== '');
                    
                    // Create array of unique URLs only
                    const uniqueImageUrls = [...new Set(allImageUrls)];
                    
                    if (uniqueImageUrls.length === 0) return;
                    
                    const currentImageUrl = currentArticle['Image URL'];
                    let currentImageIndex = uniqueImageUrls.findIndex(url => url === currentImageUrl);
                    
                    // If current image not found, start from the beginning
                    if (currentImageIndex === -1) {
                        currentImageIndex = 0;
                    } else {
                        // Move to next image
                        currentImageIndex = currentImageIndex < uniqueImageUrls.length - 1 ? currentImageIndex + 1 : 0;
                    }
                    
                    const newImageUrl = uniqueImageUrls[currentImageIndex];
                    console.log('Next image:', currentImageIndex + 1, '/', uniqueImageUrls.length, newImageUrl);
                    
                    if (newImageUrl) {
                        handleFieldChange('Image URL', newImageUrl);
                    }
                }
            };

            const handleFilterChange = (filterType, value) => {
                setFilters(prev => ({
                    ...prev,
                    [filterType]: value
                }));
            };

            const handleFieldChange = (field, value) => {
                setCurrentArticle(prev => ({
                    ...prev,
                    [field]: value
                }));
                setIsModified(true);
            };

            const handleSave = () => {
                saveArticle('Edited');
            };

            const handlePublish = () => {
                saveArticle('Published');
            };

            const goToArticle = (index) => {
                if (index >= 0 && index < articles.length) {
                    setCurrentIndex(index);
                    setCurrentArticle({...articles[index]});
                    setIsModified(false);
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    goToArticle(currentIndex - 1);
                }
            };

            const handleNext = () => {
                if (currentIndex < articles.length - 1) {
                    goToArticle(currentIndex + 1);
                }
            };

            useEffect(() => {
                fetchArticles();
            }, [filters]);

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="flex items-center space-x-2">
                            <div className="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                            <span>Loading articles...</span>
                        </div>
                    </div>
                );
            }

            if (error && articles.length === 0) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="bg-white p-8 rounded-lg shadow-md max-w-md w-full">
                            <div className="bg-red-50 border border-red-200 rounded-md p-4 mb-4">
                                <h3 className="text-red-800 font-medium">Error</h3>
                                <p className="text-red-700 text-sm mt-1">{error}</p>
                            </div>
                            <button 
                                onClick={fetchArticles}
                                className="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
                            >
                                Try Again
                            </button>
                        </div>
                    </div>
                );
            }

            if (!currentArticle && articles.length === 0) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <p className="text-gray-600">No articles found</p>
                        </div>
                    </div>
                );
            }

            // If we have no current article but do have articles in state, show first one
            if (!currentArticle && articles.length > 0) {
                setCurrentArticle({...articles[0]});
                setCurrentIndex(0);
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="flex items-center space-x-2">
                            <div className="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                            <span>Loading article...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="max-w-4xl mx-auto p-6">
                        <div className="bg-white rounded-lg shadow-md">
                            {/* Header */}
                            <div className="p-6 border-b border-gray-200">
                                <div className="flex items-center justify-between">
                                    <h1 className="text-2xl font-bold text-gray-900">Article Editor</h1>
                                    <div className="flex items-center space-x-4">
                                        <span className="text-sm text-gray-500">
                                            Article {currentArticle['Article Number'] || 'N/A'} | {currentIndex + 1} of {articles.length}
                                        </span>
                                        
                                        {/* Jump to article section */}
                                        <div className="flex items-center space-x-2">
                                            <span className="text-sm text-gray-600">Jump to:</span>
                                            <input
                                                type="number"
                                                value={jumpToNumber}
                                                onChange={(e) => setJumpToNumber(e.target.value)}
                                                onKeyPress={(e) => {
                                                    if (e.key === 'Enter') {
                                                        handleJumpToArticle();
                                                    }
                                                }}
                                                placeholder="#"
                                                className="w-16 px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
                                            />
                                            <button
                                                onClick={handleJumpToArticle}
                                                className="px-2 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors"
                                            >
                                                Go
                                            </button>
                                        </div>
                                        
                                        <div className="flex space-x-2">
                                            <button
                                                onClick={handlePrev}
                                                disabled={currentIndex === 0}
                                                className={`p-2 rounded transition-colors ${
                                                    currentIndex === 0
                                                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                ←
                                            </button>
                                            <button
                                                onClick={handleNext}
                                                disabled={currentIndex === articles.length - 1}
                                                className={`p-2 rounded transition-colors ${
                                                    currentIndex === articles.length - 1
                                                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                →
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Error Display */}
                            {error && (
                                <div className="mx-6 mt-6 bg-red-50 border border-red-200 rounded-md p-4">
                                    <h3 className="text-red-800 font-medium">Error</h3>
                                    <p className="text-red-700 text-sm mt-1">{error}</p>
                                    <button 
                                        onClick={() => setError(null)}
                                        className="mt-2 px-3 py-1 bg-red-100 text-red-800 text-sm rounded hover:bg-red-200 transition-colors"
                                    >
                                        Dismiss
                                    </button>
                                </div>
                            )}

                            {/* Main Content */}
                            <div className="p-6">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {/* Left Column - Form Fields */}
                                    <div className="space-y-6">
                                        {/* Headline */}
                                        <div className="space-y-2">
                                            <label className="block text-sm font-medium text-gray-700">Headline</label>
                                            <input
                                                type="text"
                                                value={currentArticle.Headline || ''}
                                                onChange={(e) => handleFieldChange('Headline', e.target.value)}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="Enter headline..."
                                            />
                                        </div>

                                        {/* Hook */}
                                        <div className="space-y-2">
                                            <label className="block text-sm font-medium text-gray-700">Hook</label>
                                            <textarea
                                                value={currentArticle.Hook || ''}
                                                onChange={(e) => handleFieldChange('Hook', e.target.value)}
                                                rows={3}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="Enter hook..."
                                            />
                                        </div>

                                        {/* Content - Made 50% larger */}
                                        <div className="space-y-2">
                                            <label className="block text-sm font-medium text-gray-700">Content</label>
                                            <textarea
                                                value={currentArticle.Content || ''}
                                                onChange={(e) => handleFieldChange('Content', e.target.value)}
                                                rows={18}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="Enter content..."
                                            />
                                        </div>

                                        {/* Focus Angle */}
                                        <div className="space-y-2">
                                            <label className="block text-sm font-medium text-gray-700">Focus Angle</label>
                                            <input
                                                type="text"
                                                value={currentArticle['Focus Angle'] || ''}
                                                onChange={(e) => handleFieldChange('Focus Angle', e.target.value)}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="Enter focus angle..."
                                            />
                                        </div>

                                        {/* Image Placement */}
                                        <div className="space-y-2">
                                            <label className="block text-sm font-medium text-gray-700">Image Placement</label>
                                            <input
                                                type="text"
                                                value={currentArticle['Image Placement'] || ''}
                                                onChange={(e) => handleFieldChange('Image Placement', e.target.value)}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="Enter image placement..."
                                            />
                                        </div>
                                    </div>

                                    {/* Right Column - Image */}
                                    <div className="space-y-4">
                                        <label className="block text-sm font-medium text-gray-700">Image</label>
                                        
                                        {/* Image Upload Area */}
                                        <div 
                                            className={`upload-area ${dragOver ? 'drag-over' : ''}`}
                                            onDragOver={handleDragOver}
                                            onDragLeave={handleDragLeave}
                                            onDrop={handleDrop}
                                        >
                                            {uploadingImage ? (
                                                <div className="flex flex-col items-center">
                                                    <div className="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                                                    <span>Uploading image...</span>
                                                </div>
                                            ) : (
                                                <div className="space-y-3">
                                                    <div className="text-6xl">📁</div>
                                                    <div>
                                                        <label className="cursor-pointer text-blue-600 hover:text-blue-800 font-medium">
                                                            <span>Click to upload</span>
                                                            <input 
                                                                type="file" 
                                                                className="hidden" 
                                                                accept="image/*"
                                                                onChange={handleFileInput}
                                                            />
                                                        </label>
                                                        <span className="text-gray-600"> or drag and drop</span>
                                                    </div>
                                                    <p className="text-sm text-gray-500">PNG, JPG, GIF up to 10MB</p>
                                                </div>
                                            )}
                                        </div>

                                        {/* Image URL Input */}
                                        <div className="flex space-x-2">
                                            <input
                                                type="url"
                                                value={currentArticle['Image URL'] || ''}
                                                onChange={(e) => handleFieldChange('Image URL', e.target.value)}
                                                placeholder="Or paste image URL..."
                                                className="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                                            />
                                            <button
                                                onClick={handlePrevImage}
                                                className="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-md transition-colors"
                                                title="Previous image"
                                            >
                                                ←
                                            </button>
                                            <button
                                                onClick={handleNextImage}
                                                className="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-md transition-colors"
                                                title="Next image"
                                            >
                                                →
                                            </button>
                                        </div>

                                        {/* Image Preview */}
                                        <div className="border border-gray-300 rounded-md overflow-hidden">
                                            <img 
                                                src={currentArticle['Image URL'] || ''} 
                                                alt="Article image"
                                                className="w-full h-auto object-contain"
                                                onError={(e) => {
                                                    e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkltYWdlIG5vdCBmb3VuZDwvdGV4dD48L3N2Zz4=';
                                                }}
                                            />
                                        </div>

                                        {/* Filters */}
                                        <div className="space-y-4 pt-4 border-t border-gray-200">
                                            <h3 className="text-sm font-medium text-gray-700">Filters</h3>
                                            
                                            {/* Status Filter */}
                                            <div className="space-y-1">
                                                <label className="block text-xs font-medium text-gray-600">Status</label>
                                                <select
                                                    value={filters.status}
                                                    onChange={(e) => handleFilterChange('status', e.target.value)}
                                                    className="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
                                                >
                                                    <option value="All">All</option>
                                                    <option value="Draft">Draft</option>
                                                    <option value="Published">Published</option>
                                                    <option value="Edited">Edited</option>
                                                    <option value="Rejected">Rejected</option>
                                                </select>
                                            </div>

                                            {/* Client Filter */}
                                            <div className="space-y-1">
                                                <label className="block text-xs font-medium text-gray-600">Client</label>
                                                <select
                                                    value={filters.client}
                                                    onChange={(e) => handleFilterChange('client', e.target.value)}
                                                    className="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
                                                >
                                                    <option value="All">All</option>
                                                    <option value="naturalelixir">naturalelixir</option>
                                                    <option value="dcsafrica">dcsafrica</option>
                                                    <option value="origin">origin</option>
                                                    <option value="slyfox">slyfox</option>
                                                </select>
                                            </div>

     {/* Source Title Filter */}
<div className="space-y-1">
    <label className="block text-xs font-medium text-gray-600">Source Title</label>
    <select
        value={filters.sourceTitle}
        onChange={(e) => handleFilterChange('sourceTitle', e.target.value)}
        className="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
    >
        <option value="All">All</option>
        {articles.length > 0 && [...new Set(articles
            .map(article => article['Source Title'])
            .filter(title => title && title.trim() !== '')
        )].sort().map(title => (
            <option key={title} value={title}>{title}</option>
        ))}
    </select>
</div>
                                            
                                        </div>
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="mt-8 flex justify-between">
                                    <div className="flex space-x-2">
                                        <button 
                                            onClick={deleteArticle}
                                            disabled={deleting}
                                            className="px-6 py-2 bg-red-600 text-white rounded transition-colors hover:bg-red-700 disabled:bg-red-400 disabled:cursor-not-allowed flex items-center"
                                        >
                                            {deleting ? (
                                                <>
                                                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div>
                                                    DELETING...
                                                </>
                                            ) : (
                                                'DELETE'
                                            )}
                                        </button>
                                        <button 
                                            onClick={rejectArticle}
                                            disabled={rejecting}
                                            className="px-6 py-2 bg-orange-600 text-white rounded transition-colors hover:bg-orange-700 disabled:bg-orange-400 disabled:cursor-not-allowed flex items-center"
                                        >
                                            {rejecting ? (
                                                <>
                                                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div>
                                                    REJECTING...
                                                </>
                                            ) : (
                                                'REJECT'
                                            )}
                                        </button>
                                    </div>
                                    <div className="flex space-x-2">
                                        <button 
                                            onClick={handleSave}
                                            disabled={!isModified || saving || publishing}
                                            className={`px-6 py-2 rounded transition-colors flex items-center ${
                                                saveSuccess
                                                    ? 'bg-green-600 text-white'
                                                    : isModified && !saving && !publishing
                                                        ? 'bg-blue-600 text-white hover:bg-blue-700' 
                                                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                            }`}
                                        >
                                            {saving ? (
                                                <>
                                                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div>
                                                    SAVING...
                                                </>
                                            ) : saveSuccess ? (
                                                'SAVED!'
                                            ) : (
                                                'SAVE CHANGES'
                                            )}
                                        </button>
                                        <button 
                                            onClick={handlePublish}
                                            disabled={!isModified || saving || publishing}
                                            className={`px-6 py-2 rounded transition-colors flex items-center ${
                                                publishSuccess
                                                    ? 'bg-green-600 text-white'
                                                    : isModified && !saving && !publishing
                                                        ? 'bg-green-600 text-white hover:bg-green-700' 
                                                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                            }`}
                                        >
                                            {publishing ? (
                                                <>
                                                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div>
                                                    PUBLISHING...
                                                </>
                                            ) : publishSuccess ? (
                                                'PUBLISHED!'
                                            ) : (
                                                'PUBLISH'
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            const handleLogin = () => {
                setIsLoggedIn(true);
                // Store login state in session storage so it persists during browser session
                sessionStorage.setItem('editorLoggedIn', 'true');
            };

            useEffect(() => {
                // Check if already logged in this session
                if (sessionStorage.getItem('editorLoggedIn') === 'true') {
                    setIsLoggedIn(true);
                }
            }, []);

            if (!isLoggedIn) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            return <ArticleEditor />;
        };

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
