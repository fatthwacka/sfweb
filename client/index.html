    <!-- Third-party scripts optimized for maximum performance -->
    <script>
      // Use requestIdleCallback for optimal performance timing
      function loadWhenIdle(callback, fallbackDelay) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(callback, { timeout: fallbackDelay });
        } else {
          setTimeout(callback, fallbackDelay);
        }
      }

      // Load critical third-party scripts after page is fully loaded
      window.addEventListener('load', function() {
        // Google Analytics - highest priority, load when CPU is idle
        loadWhenIdle(function() {
          try {
            var ga = document.createElement('script');
            ga.async = true;
            ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-3W8SJ9EPEF';
            ga.onerror = function() { console.warn('Google Analytics failed to load'); };
            document.head.appendChild(ga);
            
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-3W8SJ9EPEF');
          } catch(e) { console.warn('GA setup error:', e); }
        }, 500);
        
        // reCAPTCHA - load when idle, lower priority than GA
        loadWhenIdle(function() {
          try {
            var recaptcha = document.createElement('script');
            recaptcha.src = 'https://www.google.com/recaptcha/api.js?render=6Le3Y7YrAAAAAJn-74S3y_kLoDIax3vY6MyisDPs';
            recaptcha.async = true;
            recaptcha.defer = true;
            recaptcha.onerror = function() { console.warn('reCAPTCHA failed to load'); };
            document.head.appendChild(recaptcha);
          } catch(e) { console.warn('reCAPTCHA setup error:', e); }
        }, 1500);
      });
    </script>

    <!-- Metricool Analytics - reliable loading with retry mechanism -->
    <script>
      // Diagnostic utility - call window.checkAnalytics() in browser console
      window.checkAnalytics = function() {
        console.group('Analytics Status Check');
        console.log('Google Analytics:', window.gtag ? 'Loaded' : 'Not loaded');
        console.log('Metricool beTracker:', window.beTracker ? 'Loaded' : 'Not loaded');
        console.log('Metricool Ready:', window.metricoolReady ? 'Yes' : 'No');
        console.log('Current path:', window.location.pathname);
        if (window.beTracker) {
          console.log('To manually track: beTracker.t({hash:"a3e8654831a8c3870479528bc528b9fc"})');
        }
        console.groupEnd();
        return { ga: !!window.gtag, metricool: !!window.beTracker, ready: !!window.metricoolReady };
      };

      // Load Metricool after page load (lower priority than GA)
      window.addEventListener('load', function() {
        setTimeout(function() {
          try {
            var metricool = document.createElement('script');
            metricool.type = 'text/javascript';
            metricool.src = 'https://tracker.metricool.com/resources/be.js';
            metricool.async = true;
            metricool.onerror = function() { console.warn('[Metricool] Script failed to load'); };
            metricool.onload = function() {
              // Retry mechanism - beTracker may not be immediately available
              var attempts = 0;
              var maxAttempts = 10;
              var checkInterval = setInterval(function() {
                attempts++;
                if (window.beTracker) {
                  clearInterval(checkInterval);
                  try {
                    window.beTracker.t({hash:"a3e8654831a8c3870479528bc528b9fc"});
                    window.metricoolReady = true;
                    console.log('[Metricool] Tracking initialised');
                  } catch(e) { console.warn('[Metricool] Tracking error:', e); }
                } else if (attempts >= maxAttempts) {
                  clearInterval(checkInterval);
                  console.warn('[Metricool] beTracker not available after ' + maxAttempts + ' attempts');
                }
              }, 100);
            };
            document.head.appendChild(metricool);
          } catch(e) { console.warn('[Metricool] Setup error:', e); }
        }, 500);
      });
    </script>
