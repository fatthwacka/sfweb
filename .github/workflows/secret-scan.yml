name: secret-scan

# The backstop. A local pre-commit hook is bypassable with `git commit
# --no-verify`, and it does not exist at all in a fresh clone where nobody ran
# `git config core.hooksPath .githooks`. This check runs on GitHub's runners and
# cannot be skipped from a developer's machine.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          # The scanner diffs a commit range, so it needs more than the tip.
          fetch-depth: 0

      - name: Prove the scanner detects a planted secret
        # If the self-test fails the job stops here. A scanner that cannot
        # demonstrate a true positive must never be allowed to report "clean".
        # This also runs the NUL-byte regression guard: GNU grep's -I once made
        # the tree scan skip a blob containing a single binary file, and CI
        # reported "clean" over a tracked, planted key.
        run: ./scripts/scan-secrets.sh --self-test


      - name: Scan the current state of the repository
        # ALWAYS runs, and is the check that actually matters.
        #
        # A range scan alone is not sufficient. It only sees `before..after`, so
        # a secret introduced in commit N is never re-examined by the push of
        # commit N+1. One green run and the key lives in the branch forever
        # behind a permanently passing check. Scanning the working tree catches
        # anything present now, regardless of when it arrived.
        run: ./scripts/scan-secrets.sh --tree

      - name: Scan the pushed range
        # Complements the tree scan: catches a secret that was added and then
        # removed within this push, which the tree scan cannot see but which is
        # still recoverable from history and must be rotated.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # A new branch, or a force-push that orphaned the old tip, reports an
          # all-zero base. The tree scan above already covered the current
          # state, so there is nothing further to do.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; the tree scan above already covered this push."
            exit 0
          fi
          ./scripts/scan-secrets.sh --range "$BASE..$HEAD"

      - name: Confirm no environment file is tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.(example|template|sample)$'; then
            echo "::error::An environment file is tracked in git."
            exit 1
          fi
          echo "No tracked .env files."
