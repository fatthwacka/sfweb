# Production overrides for docker-compose.yml
# This file contains production-specific settings including Traefik integration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      platforms:
        - linux/amd64  # Single platform for VPS compatibility (replaces multi-platform from base)
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
        VITE_UPLOAD_URL: ${VITE_UPLOAD_URL:-}
    environment:
      NODE_ENV: production
    volumes: 
      # Production uses minimal volume mounts
      - config_data:/app/server/data  # Persistent configuration only
    command: npm start
    profiles: []  # Remove dev profile restriction
    networks:
      - sfweb-network
      - root_default  # Connect to Traefik network for reverse proxy
    labels:
      # Traefik configuration for production domain routing
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"

      # HTTP to HTTPS redirect (supports both www and non-www)
      - "traefik.http.routers.slyfox-http.rule=Host(`slyfox.co.za`) || Host(`www.slyfox.co.za`)"
      - "traefik.http.routers.slyfox-http.entrypoints=web"
      - "traefik.http.routers.slyfox-http.middlewares=slyfox-redirect"
      - "traefik.http.middlewares.slyfox-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.slyfox-redirect.redirectscheme.permanent=true"

      # HTTPS configuration (supports both www and non-www)
      - "traefik.http.routers.slyfox-https.rule=Host(`slyfox.co.za`) || Host(`www.slyfox.co.za`)"
      - "traefik.http.routers.slyfox-https.entrypoints=websecure"
      - "traefik.http.routers.slyfox-https.tls=true"
      - "traefik.http.routers.slyfox-https.tls.certresolver=mytlschallenge"

      # Upload subdomain - bypasses Cloudflare for large file uploads (>100MB)
      # DNS: upload.slyfox.co.za → 168.231.86.89 (DNS only, grey cloud - NOT proxied)
      - "traefik.http.routers.slyfox-upload-http.rule=Host(`upload.slyfox.co.za`)"
      - "traefik.http.routers.slyfox-upload-http.entrypoints=web"
      - "traefik.http.routers.slyfox-upload-http.middlewares=slyfox-redirect"
      - "traefik.http.routers.slyfox-upload-https.rule=Host(`upload.slyfox.co.za`)"
      - "traefik.http.routers.slyfox-upload-https.entrypoints=websecure"
      - "traefik.http.routers.slyfox-upload-https.tls=true"
      - "traefik.http.routers.slyfox-upload-https.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.slyfox-upload-https.service=slyfox"

      # Service configuration
      - "traefik.http.services.slyfox.loadbalancer.server.port=5000"

  # Remove adminer from production
  adminer:
    profiles:
      - never  # Effectively disables adminer in production

# Production requires the external Traefik network
networks:
  root_default:
    external: true